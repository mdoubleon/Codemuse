name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project build tooling
        run: python -m pip install --upgrade pip setuptools
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Verify packaged web assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "codemuse/web/static/assets/codemuse-logo.webp",
              "codemuse/web/static/assets/cat-idle-1.webp",
              "codemuse/web/static/assets/cat-work-1.webp",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing packaged assets: {missing}")
          print(f"Verified {len(required)} WebP assets in {wheel.name}")
          PY
